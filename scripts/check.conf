# scripts/check.conf — LeaveManager (C# / ASP.NET Core, net8.0; SDK 10 ile derlenir)
# Format: <name>: <command> — sirayla, ilk hatada durur. [fast] etiketli adimlar ./scripts/check --fast'ta kosar.
#
# Resource hygiene envanteri (docs/testing.md, Resource hygiene):
#   build  — birakabilecegi surecler: MSBuild worker node'lari (node reuse), Roslyn derleme sunucusu
#            (VBCSCompiler), Razor build server, MSBuild server. Veri: yalnizca bin/ obj/ (build ciktisi).
#   format — MSBuildWorkspace / BuildHost alt sureci (komutla birlikte kapanir). Veri: yok (--verify-no-changes yazmaz).
#   test   — vstest.console + testhost (kosu bitince kapanir); uygulama TestServer ile surec icinde,
#            port acilmaz. Veri: Db statik ve bellekte, her test surecinde Seed() ile sifirdan kurulur;
#            diske/DB'ye hicbir sey yazilmaz -> sonraki kosuya veri tasinmaz (rule 5).
# Hepsi icin tek anahtar: --disable-build-servers (.NET 7+; node reuse, VBCSCompiler, Razor ve MSBuild server kapali).
#
# Iki hiz (docs/testing.md, Two speeds): test adimi SECICI ile bolunur, liste ile degil —
# hizli = Category!=Slow, yalniz tam = Category=Slow. Yeni bir test hangisine dusse de kosar.
# NOT: yeni bir test projesi eklenirse build/format/test adimlarina eklenmelidir (docs/testing.md).

# resource hygiene: no build servers (MSBuild node reuse, VBCSCompiler, Razor server)
build [fast]: dotnet build tests/LeaveManager.Tests/LeaveManager.Tests.csproj -nologo -v q --disable-build-servers
# resource hygiene: format exits with its BuildHost; verify mode writes nothing. Iki proje ayri: test projesi uzerinden calistirmak Program.cs'i kapsamiyor.
format [fast]: dotnet format LeaveManager.csproj --verify-no-changes -v q && dotnet format tests/LeaveManager.Tests/LeaveManager.Tests.csproj --verify-no-changes -v q
# resource hygiene: no build servers; testhost exits after the run; in-memory data, nothing persisted
test [fast]: dotnet test tests/LeaveManager.Tests/LeaveManager.Tests.csproj --no-build -nologo --disable-build-servers --filter "Category!=Slow"
# resource hygiene: same as test; full-only half of the selector split
test-slow: dotnet test tests/LeaveManager.Tests/LeaveManager.Tests.csproj --no-build -nologo --disable-build-servers --filter "Category=Slow"
